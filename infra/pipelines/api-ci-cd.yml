trigger:
  branches:
    include:
      - main
  paths:
    include:
      - TicketTest.Api/**
      - TicketTest.Api.Tests/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - TicketTest.Api/**
      - TicketTest.Api.Tests/**

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  dotnetVersion: '8.0.x'
  azureServiceConnection: 'sc-esr-dev'
  apiAppName: 'api-ticketing-dev'

stages:
- stage: Build
  displayName: Build and Test
  jobs:
  - job: Build
    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        version: $(dotnetVersion)

    - script: |
        dotnet restore TicketTest.sln
      displayName: Restore

    - script: |
        dotnet build TicketTest.sln \
          --configuration $(buildConfiguration) \
          --no-restore
      displayName: Build

    - script: |
        dotnet test TicketTest.Api.Tests/TicketTest.Api.Tests.csproj \
          --configuration $(buildConfiguration) \
          --no-build \
          --logger trx \
          --results-directory $(Agent.TempDirectory)/TestResults
      displayName: Run tests

    - task: PublishTestResults@2
      displayName: Publish test results
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '**/*.trx'
        searchFolder: $(Agent.TempDirectory)/TestResults

    - script: |
        dotnet publish TicketTest.Api/TicketTest.Api.csproj \
          --configuration $(buildConfiguration) \
          --no-build \
          --output $(Build.ArtifactStagingDirectory)/api
      displayName: Publish API

    - task: ArchiveFiles@2
      displayName: Package API
      inputs:
        rootFolderOrFile: $(Build.ArtifactStagingDirectory)/api
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/ticketing-api.zip
        replaceExistingArchive: true

    - publish: $(Build.ArtifactStagingDirectory)/ticketing-api.zip
      artifact: api

- stage: Deploy
  displayName: Deploy API
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployApi
    environment: ticketing-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: api

          - task: AzureWebApp@1
            displayName: Deploy API App Service
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: webAppLinux
              appName: $(apiAppName)
              package: $(Pipeline.Workspace)/api/ticketing-api.zip