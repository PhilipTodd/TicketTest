trigger:
  branches:
    include:
      - main
  paths:
    include:
      - TicketTest.Client/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - TicketTest.Client/**

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.x'

stages:
- stage: Build
  displayName: Build Angular Client
  jobs:
  - job: Build
    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: Install Node.js
      inputs:
        versionSpec: $(nodeVersion)

    - script: |
        node --version
        npm --version
      displayName: Show Node and npm versions

    - script: |
        pwd
        ls -la
        echo "package.json:"
        cat package.json
        echo "package-lock.json header:"
        head -40 package-lock.json
      workingDirectory: TicketTest.Client
      displayName: Inspect client package files

    - script: |
        npm ci --verbose
      workingDirectory: TicketTest.Client
      displayName: Install dependencies

    - script: |
        npm run build
      workingDirectory: TicketTest.Client
      displayName: Build Angular application

    - publish: TicketTest.Client/dist
      artifact: client